[versions]
# Versión de Java (bytecode y source) para todos los módulos.
# Sin decimales: "17", no "17.0" (lo leen JavaVersion.toVersion y JvmTarget.fromTarget).
java = "17"
agp = "9.5.2"
# core-ktx 1.19+ exige compileSdk 37 y AGP 9.1+ (minCompileSdk en su AAR).
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.1"
activityCompose = "1.13.0"
kotlin = "2.4.21"
# Compose 1.13+ (BOM 2026.11.01+) exige compileSdk 37.1 (minCompileMinorSdk en sus AAR).
composeBom = "2026.11.01"
coroutines = "1.11.0"
vosk = "0.3.75"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
# Modelo de Vosk para la palabra clave (licencia Apache 2.0). Lo descarga la tarea downloadVoskModel de :app.
# Vosk no publica checksums: el SHA-256 se calculó en la primera descarga (HTTPS, sitio oficial) y queda fijado.
voskModelUrl = "https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip"
voskModelSha256 = "09b239888f633ef2f0b4e09736e3d9936acfd810bc65d53fad45261762c6511f"
# sherpa-onnx (Apache 2.0; trae ONNX Runtime, MIT). No está en un repositorio Maven verificado: el AAR se baja
# de los releases de GitHub (tarea downloadSherpaAar). SHA-256 = el digest que muestra GitHub, verificado en la descarga.
sherpaOnnx = "2.0.3"
sherpaOnnxAarUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar"
sherpaOnnxAarSha256 = "4c766e2e74c9d33d595338c21fe3b305c73ba45d47e96a235675c33142a2ec50"
# Modelo KWS en inglés (README: Apache 2.0; entrenado con GigaSpeech, ver el riesgo aceptado en CLAUDE.md).
# GitHub no publica su checksum en una página legible: el SHA-256 se calculó en la primera descarga (HTTPS) y queda fijado.
sherpaKwsModelUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2"
sherpaKwsModelSha256 = "f170013b4716e41b62b9bfd809687c207cef798ef9bc6534d524e17af9b6561a"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
vosk-android = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }
kotlinx-coroutines-test ={ group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }

